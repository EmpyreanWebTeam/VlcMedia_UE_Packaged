[FilterPlugin]
+Files=Config/**
+Files=Content/**
+Files=Resources/**
+Files=Source/**
+Files=ThirdParty/vlc/Win64/**

+Include=*.uplugin
+Include=Resources/**
+Include=ThirdParty/**
+Include=Binaries/**
+Include=Content/**
+Include=Config/**       ; include Tools folder so InstallVlcRuntime.bat can be packaged
+Include=ThirdParty/vlc/Win64/**

+NonAssetDirPaths=ThirdParty
+NonAssetDirPaths=Resources/_runtime

; ---- strip junk / build artifacts ----
+Exclude=Intermediate/**
+Exclude=Saved/**
+Exclude=.git/**
+Exclude=.svn/**
+Exclude=.vs/**
+Exclude=.idea/**
+Exclude=docs/**
+Exclude=HostProject/**
+Exclude=DerivedDataCache/**
+Exclude=*.sln
+Exclude=*.vcxproj*
+Exclude=*.pdb
-Exclude=Resources/_runtime/**
-Exclude=Tools/**

[/Script/UnrealEd.PluginPackagingSettings]
+WhitelistDirectories=Resources/_runtime
+WhitelistRegex=(?i)^Resources/_runtime/UnzipThis\.zip$
+WhitelistRegex=(?i)^Resources/_runtime/InstallVlcRuntime\.bat$
+WhitelistRegex=(?i)^ThirdParty/vlc/Win64/.*$

; keep bloat out
+BlacklistRegex=^Binaries/.*$
+BlacklistRegex=^Intermediate/.*$
+BlacklistRegex=^Saved/.*$